name: AI-Native Pipeline (Simplified - Single Server)

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  push:
    branches: [master]
  issue_comment:
    types: [created]

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 人类审核闸口: 人类在 PR 上 Approve → 自动打 ✅ approved 标签
  # 这是唯一能触发合并的路径，AI 无法自行 Approve，合并权锁在人类
  # ═══════════════════════════════════════════════════════════════
  human-approval-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    steps:
      - name: Apply approved label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['✅ approved']
            })

  # ═══════════════════════════════════════════════════════════════
  # 阶段1: 质量门禁 (本机开发环境验证)
  # 触发: PR创建/更新
  # 检查: Lint + 单元测试 + 集成测试 + E2E测试
  # ═══════════════════════════════════════════════════════════════
  quality-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # 安装Node.js
          cd frontend
          npm ci

          # 安装Python
          cd ../backend
          pip install -r requirements.txt

      - name: Frontend - Lint
        run: cd frontend && npm run lint

      - name: Frontend - TypeCheck
        run: cd frontend && npm run typecheck

      - name: Frontend - Unit Tests
        run: cd frontend && npm run test

      - name: Backend - Unit Tests
        run: cd backend && pytest -v

      - name: Backend - Integration Tests
        run: cd backend && pytest tests/ -v

      - name: Coverage Check
        run: |
          cd frontend
          npm run test -- --coverage --reporter=json --reporter=default
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if [ $(echo "$COVERAGE < 70" | bc) -eq 1 ]; then
            echo "❌ Coverage below 70%"
            exit 1
          fi

      # E2E测试 (模拟生产配置)
      - name: Setup E2E Environment
        run: |
          # 启动后端
          cd backend
          cp .env.example .env
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

          # 启动前端 (生产配置)
          cd ../frontend
          cp .env.production .env
          npm run build
          npm run preview -- --port 5173 &
          sleep 10

      - name: Run E2E Tests
        run: |
          cd frontend
          npx playwright test --project=chromium

      - name: Label PR - Quality Passed
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['✅ quality-passed']
            })

      - name: Label PR - Quality Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['❌ quality-failed']
            })

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 质量门禁未通过\n\n请查看上方日志修复问题。\n\n修复后重新push代码，流水线会自动重新运行。`
            })

  # ═══════════════════════════════════════════════════════════════
  # 阶段2: AI 预审 (advisory) + 请求人类审核
  # 触发: 质量门禁通过
  # 动作: 提示 AI 代码审查助手预审 + 请求人类审核者 Approve
  # ═══════════════════════════════════════════════════════════════
  request-architect-review:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: contains(github.event.pull_request.labels.*.name, '✅ quality-passed')
    steps:
      - name: Request Review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📋 CI 全绿，进入审核阶段\n\n### AI 代码审查助手预审清单 (advisory，仅供参考)\n\n- [ ] 配置一致性 (无硬编码 host/URL，生产无 localhost)\n- [ ] 测试充分 (E2E 用生产配置，覆盖率≥70%，bug 有复现测试)\n- [ ] 代码质量 (无吞异常/@ts-ignore/删断言作弊)\n- [ ] 架构合理 + 安全 (权限/token 有效期/敏感信息)\n\n### 确定性门禁结果\n\n- ✅ Lint / TypeCheck 通过\n- ✅ 单元 / 集成测试通过\n- ✅ E2E 测试通过 (生产配置)\n- ✅ 覆盖率达标\n\n---\n\n⚠️ **合并闸口是人类，不是 AI**。AI 预审只留评论供参考。\n请**人类审核者** Review 并 Approve 后，PR 会自动合并到 master。`
            })

  # ═══════════════════════════════════════════════════════════════
  # 阶段3: 自动合并
  # 触发: 人类审核者 Approve (添加标签 ✅ approved)
  # 动作: 自动合并PR到master + 创建部署确认Issue
  # 说明: 该标签只应由人类审核者的 PR Approve 触发，禁止 AI 自行添加
  # ═══════════════════════════════════════════════════════════════
  auto-merge-and-create-deployment-issue:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, '✅ quality-passed') &&
      contains(github.event.pull_request.labels.*.name, '✅ approved')
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request

            // 合并PR
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${pr.number})`
            })

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ 已合并到master\n\n代码已合并，正在创建部署确认Issue...`
            })

      - name: Create Deployment Confirmation Issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const date = new Date().toISOString().split('T')[0]

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 部署确认 - ${date}`,
              body: `## 部署信息\n\n- **分支**: master\n- **PR**: #${pr.number}\n- **时间**: ${new Date().toISOString()}\n- **变更**: ${pr.title}\n\n## 变更内容\n\n${pr.body || '无详细说明'}\n\n---\n\n## ✅ 确认上线\n\n回复 **"确认上线"** 开始自动部署。\n\n回复 **"拒绝"** 取消部署。\n\n### 部署流程\n\n1. 构建Docker镜像\n2. SSH到生产服务器 (111.229.214.179)\n3. 拉取最新代码\n4. 重新部署\n5. 冒烟测试验证\n6. 报告结果\n\n---\n\n**注意**: 部署期间服务不会中断（滚动更新）。如冒烟测试失败会自动回滚。`,
              labels: ['deployment-confirmation', 'waiting-user-confirmation'],
              assignees: ['陈豪']
            })

  # ═══════════════════════════════════════════════════════════════
  # 阶段4: 自动部署到生产 (单服务器)
  # 触发: 用户在部署确认Issue回复"确认上线"
  # 动作: SSH到生产服务器 → 拉取代码 → 部署 → 冒烟测试
  # ═══════════════════════════════════════════════════════════════
  deploy-to-production:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'deployment-confirmation') &&
      contains(github.event.comment.body, '确认上线')
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        id: deploy
        run: |
          echo "🚀 开始部署到生产服务器..."

          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            set -e

            echo "📍 进入项目目录"
            cd /opt/vocabmaster

            echo "📥 拉取最新代码"
            git fetch origin
            git reset --hard origin/master

            echo "🔨 构建Docker镜像"
            docker-compose -f docker-compose.prod.yml build --no-cache

            echo "🚀 滚动更新部署"
            docker-compose -f docker-compose.prod.yml up -d

            echo "⏳ 等待服务启动"
            sleep 30

            echo "🏥 健康检查"
            curl -f http://localhost:8000/health || exit 1

            echo "✅ 部署成功"
          EOF

          echo "deploy_status=success" >> $GITHUB_OUTPUT

      - name: Run Smoke Tests
        if: steps.deploy.outputs.deploy_status == 'success'
        run: |
          echo "🧪 运行冒烟测试..."

          # 等待服务完全启动
          sleep 10

          # 测试首页
          curl -f http://${{ secrets.PROD_HOST }}/ || exit 1

          # 测试API
          curl -f http://${{ secrets.PROD_HOST }}:8000/health || exit 1

          # 测试登录API
          curl -X POST http://${{ secrets.PROD_HOST }}:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"123456"}' || exit 1

          echo "✅ 冒烟测试通过"

      - name: Report Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ 部署成功\n\n- **生产URL**: http://${{ secrets.PROD_HOST }}\n- **API文档**: http://${{ secrets.PROD_HOST }}:8000/docs\n- **部署时间**: ${new Date().toISOString()}\n- **冒烟测试**: ✅ 通过\n\n### 验证步骤\n\n1. 访问 http://${{ secrets.PROD_HOST }}\n2. 使用测试账号 \`test / 123456\` 登录\n3. 验证核心功能正常\n\n---\n\n部署完成，服务正常运行。`
            })

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['deployment-success']
            })

      - name: Rollback on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // 自动回滚
            const rollback = `
              cd /opt/vocabmaster
              git reset --hard HEAD~1
              docker-compose -f docker-compose.prod.yml up -d --build
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 部署失败\n\n**状态**: 已自动回滚到上一版本\n\n**失败原因**: 检查上方日志\n\n**下一步**: 软件工程师修复问题后重新创建部署确认Issue。\n\n---\n\n服务已回滚，当前运行上一版本。`
            })

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['deployment-failed']
            })

  # ═══════════════════════════════════════════════════════════════
  # 阶段5: 部署被拒绝
  # 触发: 用户回复"拒绝"
  # 动作: 关闭部署确认Issue
  # ═══════════════════════════════════════════════════════════════
  deployment-rejected:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'deployment-confirmation') &&
      contains(github.event.comment.body, '拒绝')
    steps:
      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 部署已取消\n\n用户已拒绝部署。\n\n如需重新部署，请创建新的部署确认Issue。`
            })

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['deployment-cancelled']
            })
