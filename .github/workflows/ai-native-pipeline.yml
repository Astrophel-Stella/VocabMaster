name: AI-Native Pipeline (Simplified - Single Server)

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
  push:
    branches: [master]
  issue_comment:
    types: [created]

# GITHUB_TOKEN 权限：默认只读，无法打标签/评论/合并。
# 本 pipeline 依赖 addLabels / createComment / merge / createIssue，
# 故显式授予写权限（否则报 403 Resource not accessible by integration）。
permissions:
  contents: write        # 合并 PR、推送
  pull-requests: write   # 打标签、评论 PR
  issues: write          # 创建/评论 部署确认 issue

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 合并闸口 = 人类手动点绿色 "Merge" 按钮 (国际标准做法)
  # 说明: 不再由 AI/脚本调 API 自动合并，因此:
  #   - 彻底移除"评论口令"这一非标准土办法 (曾是安全洞: 持 token 的
  #     AI 也能发同样的评论，等于自审自批)。
  #   - 人类点绿色按钮产生的 push 归属于人类，会正常触发下方
  #     create-deployment-issue (修掉 GITHUB_TOKEN 合并 push 不触发
  #     workflow 的缺陷)。
  #   - 建议在仓库 Settings→Branches 对 master 开启分支保护:
  #     Require status checks = ✅ quality-passed，使门禁未过时
  #     绿色按钮不可点 (可选，进一步硬化)。
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # 部署确认 Issue 创建 (作为部署记录 / 通知)
  # 触发: master 更新 (人类点绿色 Merge 按钮后的 push)
  # 说明: push 事件使用"被推送 commit 里"的 workflow 版本。
  #      真正的上线闸口是下方 deploy 的 environment: production-gate
  #      (环境审批)，本 Issue 仅承载"共享上下文"—— 记录本次部署内容。
  # ═══════════════════════════════════════════════════════════════
  create-deployment-issue:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Create Deployment Confirmation Issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha.slice(0, 7);
            const title = (context.payload.head_commit && context.payload.head_commit.message || '').split('\n')[0];
            const date = new Date().toISOString().split('T')[0];

            await github.rest.issues.create({
              owner, repo,
              title: `🚀 部署确认 - ${date} (${sha})`,
              body: `## 部署信息\n\n- **分支**: master\n- **Commit**: ${sha}\n- **时间**: ${new Date().toISOString()}\n- **变更**: ${title || '(无 commit 标题)'}\n\n---\n\n## ✅ 确认上线\n\n回复 **"确认上线"** 开始自动部署。\n\n回复 **"拒绝"** 取消部署。\n\n### 部署流程\n\n1. 构建Docker镜像\n2. SSH到生产服务器 (111.229.214.179)\n3. 拉取最新代码\n4. 重新部署\n5. 冒烟测试验证\n6. 报告结果\n\n---\n\n**注意**: 部署期间服务不会中断（滚动更新）。如冒烟测试失败会自动回滚。`,
              labels: ['deployment-confirmation', 'waiting-user-confirmation']
            });

  # ═══════════════════════════════════════════════════════════════
  # 阶段1: 质量门禁 (本机开发环境验证)
  # 触发: PR创建/更新
  # 检查: Lint + 单元测试 + 集成测试 + E2E测试
  # ═══════════════════════════════════════════════════════════════
  quality-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # 安装Node.js
          cd frontend
          npm ci

          # 安装Python
          cd ../backend
          pip install -r requirements.txt

      - name: Frontend - Lint
        run: cd frontend && npm run lint

      - name: Frontend - TypeCheck
        run: cd frontend && npm run typecheck

      - name: Frontend - Unit Tests
        run: cd frontend && npm run test

      - name: Backend - Unit Tests
        run: cd backend && pytest -v

      - name: Backend - Integration Tests
        run: cd backend && pytest tests/ -v

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Coverage Check
        run: |
          cd frontend
          # vitest.config.ts 已配置 v8 provider + json-summary reporter
          npm run test:coverage
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Coverage: $COVERAGE%"
          # 用 jq 做数值比较，避免依赖 bc
          if jq -e '.total.lines.pct < 70' coverage/coverage-summary.json > /dev/null; then
            echo "❌ Coverage below 70%"
            exit 1
          fi
          echo "✅ Coverage >= 70%"

      # E2E测试 (生产构建模式)
      - name: Setup E2E Environment
        run: |
          # 启动后端 (先跑种子脚本: test/123456 用户 + 词库数据)
          cd backend
          cp .env.example .env
          python init_db.py
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # 等待后端健康就绪
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 1; done

          # 前端生产构建；E2E 中 API 指向 CI 内的测试后端 (VITE_ 进程变量优先级高于 .env 文件)
          cd ../frontend
          cp .env.production .env
          VITE_API_URL=http://localhost:8000 npm run build
          npm run preview -- --port 5173 &
          # 等待前端就绪
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ && break || sleep 2; done

      - name: Run E2E Tests
        run: |
          cd frontend
          npx playwright test --project=chromium

      - name: Label PR - Quality Passed
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['✅ quality-passed']
            })

      # 事件驱动自动化: CI 全绿 → webhook 唤起「AI 代码审查助手」做深度预审
      # (GitOps 标准: CI 状态变化 → webhook → 触发下游智能体, 零人工 @)
      # URL 存于 GitHub Secret, 不明文出现; 载荷带 PR 号供智能体定位
      - name: Trigger AI deep pre-review (autopilot)
        if: success()
        env:
          REVIEW_URL: ${{ secrets.AUTOPILOT_REVIEW_URL }}
        run: |
          if [ -z "$REVIEW_URL" ]; then
            echo "⚠️ AUTOPILOT_REVIEW_URL 未配置, 跳过 (不阻塞流水线)"; exit 0
          fi
          curl -sS -X POST "$REVIEW_URL" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: review-${{ github.event.pull_request.number }}-${{ github.sha }}" \
            -d '{"event":"quality-passed","pr_number":${{ github.event.pull_request.number }},"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}' \
            || echo "⚠️ 预审 webhook 调用失败, 不阻塞流水线 (人类仍可手动审核)"

      - name: Label PR - Quality Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['❌ quality-failed']
            })

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 质量门禁未通过\n\n软件工程师将被自动唤起定位并修复 (事件驱动)。\n\n如需人工介入, 可在本 PR 留言。`
            })

      # 事件驱动自动化: CI 失败 → webhook 唤起「软件工程师」自动修复
      - name: Trigger self-heal (autopilot)
        if: failure()
        env:
          FIX_URL: ${{ secrets.AUTOPILOT_FIX_URL }}
        run: |
          if [ -z "$FIX_URL" ]; then
            echo "⚠️ AUTOPILOT_FIX_URL 未配置, 跳过 (不阻塞流水线)"; exit 0
          fi
          curl -sS -X POST "$FIX_URL" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: fix-${{ github.event.pull_request.number }}-${{ github.sha }}" \
            -d '{"event":"quality-failed","pr_number":${{ github.event.pull_request.number }},"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}' \
            || echo "⚠️ 自修复 webhook 调用失败, 不阻塞流水线 (人类可手动介入)"

  # ═══════════════════════════════════════════════════════════════
  # 阶段2: AI 预审 (advisory) + 请求人类审核
  # 触发: 质量门禁通过
  # 动作: 提示 AI 代码审查助手预审 + 请求人类审核者 Approve
  # ═══════════════════════════════════════════════════════════════
  request-architect-review:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: contains(github.event.pull_request.labels.*.name, '✅ quality-passed')
    steps:
      - name: Request Review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📋 CI 全绿，进入审核阶段\n\n**AI 代码审查助手已被自动唤起**，正在对本次改动做深度预审（advisory），稍后会在本 PR 追加一条结构化预审报告。\n\n### 确定性门禁结果\n\n- ✅ Lint / TypeCheck 通过\n- ✅ 单元 / 集成测试通过\n- ✅ E2E 测试通过 (生产配置)\n- ✅ 覆盖率达标\n\n---\n\n⚠️ **合并闸口是人类，不是 AI**。\n请人类审核者看完 AI 深度预审报告后，**亲手点绿色 "Merge" 按钮** 合并到 master。\nAI/流水线不会自动合并 —— 合并这一下只有你能点。`
            })

  # ═══════════════════════════════════════════════════════════════
  # 阶段4: 自动部署到生产 (单服务器)
  # 触发: 部署确认 Issue 上回复"确认上线" (仅用于"启动"本流程)
  # 真·上线闸口: environment: production-gate (环境审批)
  #   —— job 会先暂停，在 GitHub 网页弹出 "Review deployments" 按钮，
  #      必须由 Required reviewers (人类) 点 Approve 才继续部署。
  #      GITHUB_TOKEN / 自动身份无资格点，故 AI 无法自行放行上线。
  #      配置位置: 仓库 Settings → Environments → production-gate →
  #      Required reviewers 添加人类审核者。
  # 动作: SSH到生产服务器 → 拉取代码 → 部署 → 冒烟测试
  # ═══════════════════════════════════════════════════════════════
  deploy-to-production:
    runs-on: ubuntu-latest
    environment: production-gate
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'deployment-confirmation') &&
      contains(github.event.comment.body, '确认上线')
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      # ═══════════════════════════════════════════════════════════════
      # SOU-38: 记录上一个 good commit 供回滚使用
      # ═══════════════════════════════════════════════════════════════
      - name: Record Last Good Commit for Rollback
        id: record-good
        run: |
          echo "📝 记录当前部署版本..."

          LAST_GOOD_SHA=$(ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} '
            cd /opt/vocabmaster 2>/dev/null && git rev-parse HEAD 2>/dev/null || echo "none"
          ' 2>/dev/null || echo "none")

          echo "last_good_sha=${LAST_GOOD_SHA}" >> $GITHUB_OUTPUT
          echo "✅ 上一次部署版本: ${LAST_GOOD_SHA}"

      - name: Deploy to Production Server
        id: deploy
        run: |
          echo "🚀 开始部署到生产服务器..."

          # SOU-38: 幂等部署脚本，撞名自愈，失败不自毁
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'REMOTE_SCRIPT'
            # 不使用 set -e 避免半路静默中止
            set -o pipefail

            DEPLOY_FAILED=0

            echo "📍 进入项目目录"
            cd /opt/vocabmaster || { echo "❌ 项目目录不存在"; DEPLOY_FAILED=1; }

            if [ $DEPLOY_FAILED -eq 0 ]; then
              echo "📥 拉取最新代码"
              git fetch origin
              git reset --hard origin/master || { echo "❌ git reset 失败"; DEPLOY_FAILED=1; }
            fi

            if [ $DEPLOY_FAILED -eq 0 ]; then
              echo "🔨 构建Docker镜像"
              docker compose -f docker-compose.prod.yml build --no-cache || { echo "❌ 镜像构建失败"; DEPLOY_FAILED=1; }
            fi

            if [ $DEPLOY_FAILED -eq 0 ]; then
              # SOU-38: 受控清理 - 仅清理本 compose 声明的服务名
              # 避免棕地遗留容器（如手动 docker run 创建的同名容器）撞名
              echo "🧹 清理遗留容器（防止撞名）"
              for svc in vocabmaster-api vocabmaster-frontend; do
                if docker ps -a --format '{{.Names}}' | grep -q "^${svc}$"; then
                  echo "  清理旧容器: ${svc}"
                  docker rm -f "${svc}" 2>/dev/null || true
                fi
              done

              # SOU-38: --remove-orphans 清理不在 compose 文件中的孤立容器
              echo "🚀 滚动更新部署（含孤立容器清理）"
              docker compose -f docker-compose.prod.yml up -d --remove-orphans || { echo "❌ 容器启动失败"; DEPLOY_FAILED=1; }
            fi

            if [ $DEPLOY_FAILED -eq 0 ]; then
              echo "⏳ 等待服务启动"
              sleep 30

              echo "🏥 健康检查"
              # 显式错误处理，不依赖 set -e
              if curl -sf http://localhost:8000/health; then
                echo "✅ 后端健康检查通过"
              else
                echo "❌ 后端健康检查失败"
                DEPLOY_FAILED=1
              fi
            fi

            # 返回部署状态
            if [ $DEPLOY_FAILED -eq 1 ]; then
              echo "DEPLOY_STATUS=failed"
              exit 1
            else
              echo "DEPLOY_STATUS=success"
            fi
          REMOTE_SCRIPT

          DEPLOY_EXIT_CODE=$?

          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            echo "deploy_status=failed" >> $GITHUB_OUTPUT
            echo "❌ 部署失败"
            exit 1
          else
            echo "deploy_status=success" >> $GITHUB_OUTPUT
            echo "✅ 部署成功"
          fi

      # ═══════════════════════════════════════════════════════════════
      # SOU-38: 内容级冒烟测试 - 杜绝假绿
      # 必须验证：
      # 1. API 健康检查返回 200
      # 2. 登录 API 正常
      # 3. 前端 JS bundle 不包含测试数据特征（防旧 bundle）
      # 4. 前端返回 HTML 包含 VocabMaster 标识
      # ═══════════════════════════════════════════════════════════════
      - name: Run Smoke Tests
        id: smoke
        if: steps.deploy.outputs.deploy_status == 'success'
        run: |
          echo "🧪 运行冒烟测试..."

          SMOKE_FAILED=0

          # 等待服务完全启动
          sleep 10

          # 测试1: 前端首页可访问
          echo "📋 测试前端首页..."
          FRONTEND_HTML=$(curl -s http://${{ secrets.PROD_HOST }}/ || echo "")
          if [ -z "$FRONTEND_HTML" ]; then
            echo "❌ 前端首页无响应"
            SMOKE_FAILED=1
          else
            echo "✅ 前端首页响应正常"
          fi

          # 测试2: 前端 HTML 包含 VocabMaster 标识
          echo "📋 验证前端内容..."
          if echo "$FRONTEND_HTML" | grep -q "VocabMaster"; then
            echo "✅ 前端包含 VocabMaster 标识"
          else
            echo "❌ 前端未包含 VocabMaster 标识，可能是旧版本或错误页面"
            SMOKE_FAILED=1
          fi

          # 测试3: SOU-38 - 获取并验证 JS bundle 内容
          echo "📋 验证 JS bundle 内容（防止旧 bundle 假绿）..."

          # 从 HTML 中提取 JS bundle URL
          JS_BUNDLE_URL=$(echo "$FRONTEND_HTML" | grep -oP 'src="\/assets\/index-[^"]+\.js"' | sed 's/src="//; s/"//' || echo "")

          if [ -n "$JS_BUNDLE_URL" ]; then
            echo "  发现 JS bundle: $JS_BUNDLE_URL"
            JS_CONTENT=$(curl -s "http://${{ secrets.PROD_HOST }}${JS_BUNDLE_URL}" || echo "")

            if [ -n "$JS_CONTENT" ]; then
              # SOU-38: 断言测试数据特征串不存在（防旧前端泄漏测试数据）
              # 这些串只应出现在测试文件中，不应出现在生产 bundle
              if echo "$JS_CONTENT" | grep -q "Password123"; then
                echo "❌ JS bundle 包含测试数据 'Password123'，疑似测试代码泄漏"
                SMOKE_FAILED=1
              else
                echo "✅ JS bundle 不包含测试数据 'Password123'"
              fi

              if echo "$JS_CONTENT" | grep -q "测试账号"; then
                echo "❌ JS bundle 包含测试数据 '测试账号'，疑似测试代码泄漏"
                SMOKE_FAILED=1
              else
                echo "✅ JS bundle 不包含测试数据 '测试账号'"
              fi

              # 验证 bundle 包含应用核心逻辑标识
              if echo "$JS_CONTENT" | grep -q "VocabMaster\|vocabmaster"; then
                echo "✅ JS bundle 包含应用标识"
              else
                echo "⚠️ JS bundle 未包含应用标识（可能是空 bundle）"
              fi
            else
              echo "⚠️ 无法获取 JS bundle 内容，跳过内容验证"
            fi
          else
            echo "⚠️ 未找到 JS bundle URL，跳过内容验证"
          fi

          # 测试4: API 健康检查
          echo "📋 测试 API 健康检查..."
          if curl -sf http://${{ secrets.PROD_HOST }}:8000/health; then
            echo "✅ API 健康检查通过"
          else
            echo "❌ API 健康检查失败"
            SMOKE_FAILED=1
          fi

          # 测试5: 登录 API（OAuth2PasswordRequestForm 要求 form 编码）
          echo "📋 测试登录 API..."
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://${{ secrets.PROD_HOST }}:8000/api/auth/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=test&password=123456" || echo "000")

          LOGIN_CODE=$(echo "$LOGIN_RESPONSE" | tail -1)
          if [ "$LOGIN_CODE" = "200" ]; then
            echo "✅ 登录 API 正常"
          else
            echo "❌ 登录 API 失败 (HTTP $LOGIN_CODE)"
            SMOKE_FAILED=1
          fi

          # 汇总结果
          if [ $SMOKE_FAILED -eq 1 ]; then
            echo "smoke_status=failed" >> $GITHUB_OUTPUT
            echo "❌ 冒烟测试失败"
            exit 1
          else
            echo "smoke_status=passed" >> $GITHUB_OUTPUT
            echo "✅ 冒烟测试全部通过"
          fi

      - name: Report Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ 部署成功\n\n- **生产URL**: http://${{ secrets.PROD_HOST }}\n- **API文档**: http://${{ secrets.PROD_HOST }}:8000/docs\n- **部署时间**: ${new Date().toISOString()}\n- **冒烟测试**: ✅ 通过（含内容级验证）\n\n### 验证步骤\n\n1. 访问 http://${{ secrets.PROD_HOST }}\n2. 使用测试账号 \`test / 123456\` 登录\n3. 验证核心功能正常\n\n---\n\n部署完成，服务正常运行。`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['deployment-success']
            });

      # ═══════════════════════════════════════════════════════════════
      # SOU-38: 真回滚 - 替换假占位符
      # 失败时真正执行 SSH 回滚，而不是只发评论
      # ═══════════════════════════════════════════════════════════════
      - name: Rollback on Failure
        if: failure()
        run: |
          echo "🔄 执行回滚..."

          LAST_GOOD_SHA="${{ steps.record-good.outputs.last_good_sha }}"

          if [ -z "$LAST_GOOD_SHA" ] || [ "$LAST_GOOD_SHA" = "none" ]; then
            echo "⚠️ 无法获取上一个 good commit，跳过回滚"
            ROLLBACK_STATUS="无法回滚（无历史版本）"
          else
            echo "📦 回滚到: ${LAST_GOOD_SHA}"

            # SOU-38: 真正执行 SSH 回滚
            ROLLBACK_OUTPUT=$(ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << REMOTE_ROLLBACK
              set -o pipefail
              ROLLBACK_FAILED=0

              cd /opt/vocabmaster || { echo "❌ 项目目录不存在"; exit 1; }

              echo "📍 回滚到 commit: ${LAST_GOOD_SHA}"
              git reset --hard ${LAST_GOOD_SHA} || { echo "❌ git reset 失败"; ROLLBACK_FAILED=1; }

              if [ \$ROLLBACK_FAILED -eq 0 ]; then
                echo "🧹 清理容器"
                for svc in vocabmaster-api vocabmaster-frontend; do
                  docker rm -f "\${svc}" 2>/dev/null || true
                done

                echo "🔨 重新构建镜像"
                docker compose -f docker-compose.prod.yml build --no-cache || { echo "❌ 构建失败"; ROLLBACK_FAILED=1; }
              fi

              if [ \$ROLLBACK_FAILED -eq 0 ]; then
                echo "🚀 启动服务"
                docker compose -f docker-compose.prod.yml up -d --remove-orphans || { echo "❌ 启动失败"; ROLLBACK_FAILED=1; }
              fi

              if [ \$ROLLBACK_FAILED -eq 0 ]; then
                echo "⏳ 等待服务启动"
                sleep 30

                echo "🏥 回滚后健康检查"
                if curl -sf http://localhost:8000/health; then
                  echo "✅ 回滚后健康检查通过"
                  echo "ROLLBACK_RESULT=success"
                else
                  echo "❌ 回滚后健康检查失败"
                  echo "ROLLBACK_RESULT=health_failed"
                fi
              else
                echo "ROLLBACK_RESULT=execution_failed"
              fi
          REMOTE_ROLLBACK
          ) || ROLLBACK_OUTPUT="SSH连接失败"

          echo "$ROLLBACK_OUTPUT"

          if echo "$ROLLBACK_OUTPUT" | grep -q "ROLLBACK_RESULT=success"; then
            echo "✅ 回滚成功，服务已恢复"
            ROLLBACK_STATUS="已成功回滚到 ${LAST_GOOD_SHA}"
          else
            echo "❌ 回滚失败，需要人工介入"
            ROLLBACK_STATUS="回滚失败，请人工检查"
          fi

          # 将回滚状态保存供下一步使用
          echo "rollback_status=${ROLLBACK_STATUS}" >> $GITHUB_OUTPUT

      - name: Report Failure
        if: failure()
        uses: actions/github-script@v7
        env:
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.rollback_status || '未执行回滚' }}
        with:
          script: |
            const rollbackStatus = process.env.ROLLBACK_STATUS;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 部署失败\n\n**状态**: ${rollbackStatus}\n\n**失败原因**: 检查上方日志\n\n**下一步**: 软件工程师修复问题后重新创建部署确认Issue。\n\n---\n\n${rollbackStatus.includes('成功') ? '服务已回滚，当前运行上一版本。' : '⚠️ 回滚可能未成功，请人工验证服务状态。'}`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['deployment-failed']
            });

  # ═══════════════════════════════════════════════════════════════
  # 阶段5: 部署被拒绝
  # 触发: 用户回复"拒绝"
  # 动作: 关闭部署确认Issue
  # ═══════════════════════════════════════════════════════════════
  deployment-rejected:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'deployment-confirmation') &&
      contains(github.event.comment.body, '拒绝')
    steps:
      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 部署已取消\n\n用户已拒绝部署。\n\n如需重新部署，请创建新的部署确认Issue。`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['deployment-cancelled']
            });
