name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # 部署后端
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying backend to production..."
          echo "⚠️  需要配置部署目标："
          echo "   - Railway: https://railway.app"
          echo "   - Render: https://render.com"
          echo "   - 自建服务器: SSH + Docker"
          echo ""
          echo "💡 配置步骤："
          echo "   1. 在部署平台创建项目"
          echo "   2. 配置环境变量（SECRET_KEY, DATABASE_URL 等）"
          echo "   3. 连接 GitHub 仓库"
          echo "   4. 设置自动部署"
          echo ""
          echo "📝 文档: docs/deployment.md"

      # ── 人类闸口：部署前确认 ──
      - name: Deployment Notice
        run: |
          echo "======================================"
          echo "  🚨 人类闸口提醒"
          echo "======================================"
          echo ""
          echo "自动部署已配置，但建议："
          echo "  1. 检查测试结果（CI 必须通过）"
          echo "  2. 确认没有破坏性变更"
          echo "  3. 检查环境变量配置"
          echo ""
          echo "部署平台会提供："
          echo "  - 部署日志"
          echo "  - 回滚功能"
          echo "  - 部署通知"
          echo "======================================"

  # 部署前端（可选）
  deploy-frontend:
    name: Deploy Frontend (Web)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: false  # 需要时取消注释

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Deploy to CDN
        run: |
          echo "Deploy to:"
          echo "  - Vercel"
          echo "  - Cloudflare Pages"
          echo "  - GitHub Pages"
