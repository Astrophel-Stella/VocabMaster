version: '3.8'

# 简化版：仅后端服务
# 适合：前端使用桌面版或单独部署

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocabmaster-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/vocabmaster.db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - APP_NAME=VocabMaster API
      - DEBUG=false
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local
