version: '3.8'

# VocabMaster 生产环境部署配置
# 包含前端 + 后端服务，统一编排

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 空字符串 → 使用相对 URL /api，由 nginx 反代到 backend:8000
        VITE_API_URL: ""
    container_name: vocabmaster-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocabmaster-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/vocabmaster.db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - APP_NAME=VocabMaster API
      - DEBUG=false
    volumes:
      - backend-data:/app/data
    healthcheck:
      # 用标准库 urllib，避免依赖未安装的 requests（镜像里没有）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local
